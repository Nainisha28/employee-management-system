spring.application.name=employee-management-system
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Your_MySQL_Password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:replace-this-secret-with-a-long-random-secret-key-at-least-32-characters}
app.jwt.expiration-ms=28800000
